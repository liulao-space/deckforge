name: test
on:
  push: { branches: [main] }
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: Presets list
        run: python3 build.py --list-presets
      - name: Build all examples × presets + JS/icon/scaffold checks
        run: node tools/validate.js
      - name: Posters render
        run: python3 tools/posters.py -o /tmp/posters

  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: npx wrapper works
        run: node bin/deckforge.js examples/orca-herdr.json -o /tmp/npx.html && test -f /tmp/npx.html
      - name: wrapper propagates failure exit codes (bad preset must fail)
        run: if node bin/deckforge.js examples/orca-herdr.json -o /tmp/bad.html --preset bogus; then echo "should have failed"; exit 1; fi
